<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>하늘 슈터</title>
<style>
  html,body { margin:0; height:100%; background:#05060f; overflow:hidden; touch-action:none; }
  body { display:flex; align-items:center; justify-content:center; font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
  canvas { display:block; background:#070a1f; }
  a.back { position:fixed; top:10px; left:10px; color:#9aa3d6; font-size:14px; text-decoration:none; background:#0009; padding:6px 10px; border-radius:8px; z-index:2; }
</style>
</head>
<body>
<a class="back" href="index.html">← 메뉴로</a>
<canvas id="c" width="480" height="720"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 480, H = 720;
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();

function loadBest() { try { return +localStorage.getItem('skyShooterBest') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('skyShooterBest', v); } catch (e) {} }

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if ((e.code === 'Space' || e.code === 'Enter') && state !== 'play') start();
});
addEventListener('keyup', e => { keys[e.code] = false; });

let pointer = null; // 드래그 중인 위치 (캔버스 좌표)
let dragOffset = { x: 0, y: 0 };
function toCanvas(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') { start(); return; }
  const p = toCanvas(e); pointer = p; dragOffset = { x: player.x - p.x, y: player.y - p.y };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => { if (pointer) pointer = toCanvas(e); });
cv.addEventListener('pointerup', () => { pointer = null; });
cv.addEventListener('pointercancel', () => { pointer = null; });

// ---------- 게임 상태 ----------
let state = 'title', best = loadBest();
let player, bullets, eBullets, enemies, items, particles, boss, score, time, spawnTimer, nextBoss, bossLevel, shake;

const stars = [];
for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random() * 3 + 0.5 });

function start() {
  player = { x: W / 2, y: H - 100, r: 16, hp: 3, inv: 0, power: 1, fireCd: 0 };
  bullets = []; eBullets = []; enemies = []; items = []; particles = [];
  boss = null; score = 0; time = 0; spawnTimer = 1; nextBoss = 3000; bossLevel = 0; shake = 0;
  state = 'play';
}

function explode(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * 220 + 40;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: Math.random() * 0.5 + 0.3, max: 0.8, color });
  }
}

function spawnEnemy() {
  const diff = Math.min(time / 60, 2.5);
  const roll = Math.random();
  let type = 0;
  if (roll > 0.55) type = 1;
  if (roll > 0.82 && time > 10) type = 2;
  const x = 40 + Math.random() * (W - 80);
  const e = { type, x, baseX: x, y: -30, t: Math.random() * 6, r: 18, vy: 110 + diff * 50 + Math.random() * 40 };
  if (type === 0) { e.hp = 1; e.pts = 100; }
  if (type === 1) { e.hp = 1; e.pts = 150; e.vy *= 0.85; }
  if (type === 2) { e.hp = 3; e.pts = 300; e.r = 22; e.vy = 90; e.stopY = 120 + Math.random() * 120; e.shootCd = 1; e.stay = 4; }
  enemies.push(e);
}

function spawnBoss() {
  bossLevel++;
  const hp = 80 + bossLevel * 50;
  boss = { x: W / 2, y: -80, r: 54, hp, max: hp, t: 0, burstCd: 2, aimCd: 1, dir: 1 };
}

function aimedBullet(x, y, speed, spread = 0) {
  const a = Math.atan2(player.y - y, player.x - x) + spread;
  eBullets.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5 });
}

function hitPlayer() {
  if (player.inv > 0) return;
  player.hp--; player.inv = 2; shake = 0.3;
  player.power = Math.max(1, player.power - 1);
  explode(player.x, player.y, 25, '#7fd4ff');
  if (player.hp <= 0) {
    explode(player.x, player.y, 70, '#ffb347');
    state = 'over';
    if (score > best) { best = score; saveBest(best); }
  }
}

function dist2(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return dx * dx + dy * dy; }

// ---------- 업데이트 ----------
function update(dt) {
  for (const s of stars) { s.y += s.z * 60 * dt * (state === 'play' ? 1.6 : 0.6); if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  if (shake > 0) shake -= dt;
  if (state !== 'play') return;

  time += dt;
  // 플레이어 이동
  const sp = 320;
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx--;
  if (keys.ArrowRight || keys.KeyD) dx++;
  if (keys.ArrowUp || keys.KeyW) dy--;
  if (keys.ArrowDown || keys.KeyS) dy++;
  if (dx || dy) { const l = Math.hypot(dx, dy); player.x += dx / l * sp * dt; player.y += dy / l * sp * dt; }
  if (pointer) {
    const tx = pointer.x + dragOffset.x, ty = pointer.y + dragOffset.y;
    player.x += (tx - player.x) * Math.min(1, dt * 18); player.y += (ty - player.y) * Math.min(1, dt * 18);
  }
  player.x = Math.max(20, Math.min(W - 20, player.x));
  player.y = Math.max(40, Math.min(H - 30, player.y));
  if (player.inv > 0) player.inv -= dt;

  // 자동 발사
  player.fireCd -= dt;
  if (player.fireCd <= 0) {
    player.fireCd = 0.13;
    const p = player.power;
    if (p === 1) { bullets.push({ x: player.x - 7, y: player.y - 20, vx: 0 }, { x: player.x + 7, y: player.y - 20, vx: 0 }); }
    else if (p === 2) { bullets.push({ x: player.x, y: player.y - 24, vx: 0 }, { x: player.x - 10, y: player.y - 16, vx: -60 }, { x: player.x + 10, y: player.y - 16, vx: 60 }); }
    else { bullets.push({ x: player.x - 6, y: player.y - 24, vx: 0 }, { x: player.x + 6, y: player.y - 24, vx: 0 }, { x: player.x - 12, y: player.y - 14, vx: -110 }, { x: player.x + 12, y: player.y - 14, vx: 110 }); }
  }
  for (const b of bullets) { b.y -= 640 * dt; b.x += b.vx * dt; }
  bullets = bullets.filter(b => b.y > -20 && !b.dead);

  // 적 생성
  if (!boss) {
    if (score >= nextBoss) spawnBoss();
    else {
      spawnTimer -= dt;
      if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = Math.max(0.28, 0.95 - time / 90) * (0.6 + Math.random() * 0.8); }
    }
  }

  // 적 업데이트
  for (const e of enemies) {
    e.t += dt;
    if (e.type === 0) e.y += e.vy * dt;
    else if (e.type === 1) { e.y += e.vy * dt; e.x = e.baseX + Math.sin(e.t * 3) * 70; }
    else {
      if (e.y < e.stopY && e.stay > 0) e.y += e.vy * dt;
      else if (e.stay > 0) {
        e.stay -= dt; e.shootCd -= dt;
        if (e.shootCd <= 0) { e.shootCd = 1.1; aimedBullet(e.x, e.y + 14, 230); }
      } else e.y += e.vy * 1.5 * dt;
    }
    if (dist2(e, player) < (e.r + player.r - 4) ** 2) { e.hp = 0; e.dead = true; explode(e.x, e.y, 20, '#ff6b6b'); hitPlayer(); }
  }

  // 보스
  if (boss) {
    boss.t += dt;
    if (boss.y < 120) boss.y += 60 * dt;
    else {
      boss.x += boss.dir * (70 + bossLevel * 15) * dt;
      if (boss.x < 80 || boss.x > W - 80) boss.dir *= -1;
      boss.burstCd -= dt; boss.aimCd -= dt;
      if (boss.burstCd <= 0) {
        boss.burstCd = Math.max(1, 2.2 - bossLevel * 0.2);
        const n = 14 + bossLevel * 2, off = boss.t;
        for (let i = 0; i < n; i++) { const a = off + i / n * Math.PI * 2; eBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(a) * 160, vy: Math.sin(a) * 160, r: 6 }); }
      }
      if (boss.aimCd <= 0) {
        boss.aimCd = 0.9;
        for (const s of [-0.2, 0, 0.2]) aimedBullet(boss.x, boss.y + 40, 260, s);
      }
    }
    if (dist2(boss, player) < (boss.r + player.r - 6) ** 2) hitPlayer();
  }

  // 플레이어 총알 충돌
  for (const b of bullets) {
    for (const e of enemies) {
      if (e.dead) continue;
      if (dist2(b, e) < (e.r + 4) ** 2) {
        b.dead = true; e.hp--;
        explode(b.x, b.y, 3, '#fff3a0');
        if (e.hp <= 0) {
          e.dead = true; score += e.pts; explode(e.x, e.y, 22, e.type === 2 ? '#c38bff' : '#ff6b6b');
          if (Math.random() < 0.09) items.push({ x: e.x, y: e.y, kind: Math.random() < 0.6 ? 'P' : 'H', t: 0 });
        }
        break;
      }
    }
    if (!b.dead && boss && boss.y > 0 && Math.abs(b.x - boss.x) < boss.r && Math.abs(b.y - boss.y) < boss.r * 0.7) {
      b.dead = true; boss.hp--; explode(b.x, b.y, 2, '#fff3a0');
      if (boss.hp <= 0) {
        explode(boss.x, boss.y, 120, '#ffb347'); shake = 0.6;
        score += 5000 * bossLevel;
        items.push({ x: boss.x - 30, y: boss.y, kind: 'P', t: 0 }, { x: boss.x + 30, y: boss.y, kind: 'H', t: 0 });
        boss = null; nextBoss = score + 5000 + bossLevel * 2000; eBullets = [];
      }
    }
  }
  enemies = enemies.filter(e => !e.dead && e.y < H + 40);

  // 적 총알
  for (const b of eBullets) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (dist2(b, player) < (b.r + 7) ** 2) { b.dead = true; hitPlayer(); }
  }
  eBullets = eBullets.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  // 아이템
  for (const it of items) {
    it.y += 110 * dt; it.t += dt;
    if (dist2(it, player) < 30 * 30) {
      it.dead = true;
      if (it.kind === 'P') { player.power = Math.min(3, player.power + 1); score += 200; }
      else player.hp = Math.min(5, player.hp + 1);
      explode(it.x, it.y, 12, it.kind === 'P' ? '#ffd84d' : '#6dff9e');
    }
  }
  items = items.filter(it => !it.dead && it.y < H + 20);
}

// ---------- 그리기 ----------
function drawPlayer() {
  if (player.inv > 0 && Math.floor(player.inv * 12) % 2 === 0) return;
  const { x, y } = player;
  ctx.save(); ctx.translate(x, y);
  // 엔진 불꽃
  ctx.fillStyle = `rgba(255,${150 + Math.random() * 80 | 0},60,0.9)`;
  ctx.beginPath(); ctx.moveTo(-6, 18); ctx.lineTo(0, 30 + Math.random() * 10); ctx.lineTo(6, 18); ctx.fill();
  // 날개
  ctx.fillStyle = '#3a8dde';
  ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(24, 12); ctx.lineTo(24, 18); ctx.lineTo(0, 12); ctx.lineTo(-24, 18); ctx.lineTo(-24, 12); ctx.closePath(); ctx.fill();
  // 동체
  ctx.fillStyle = '#d8ecff';
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(7, -8); ctx.lineTo(7, 18); ctx.lineTo(-7, 18); ctx.lineTo(-7, -8); ctx.closePath(); ctx.fill();
  // 꼬리날개
  ctx.fillStyle = '#3a8dde';
  ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(11, 22); ctx.lineTo(-11, 22); ctx.closePath(); ctx.fill();
  // 조종석
  ctx.fillStyle = '#1b3b6b';
  ctx.beginPath(); ctx.ellipse(0, -10, 3.5, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  if (e.type === 1) ctx.rotate(Math.cos(e.t * 3) * 0.35);
  const body = e.type === 0 ? '#ff5d5d' : e.type === 1 ? '#ff9f43' : '#a66bff';
  const wing = e.type === 0 ? '#a82929' : e.type === 1 ? '#b8650f' : '#5e2fb0';
  const s = e.r / 18;
  ctx.scale(s, s);
  ctx.fillStyle = wing;
  ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(20, -12); ctx.lineTo(20, -6); ctx.lineTo(0, 12); ctx.lineTo(-20, -6); ctx.lineTo(-20, -12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(0, 22); ctx.lineTo(7, 4); ctx.lineTo(6, -16); ctx.lineTo(-6, -16); ctx.lineTo(-7, 4); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.ellipse(0, 6, 3, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawBoss() {
  const b = boss;
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.fillStyle = '#4b1a6b';
  ctx.beginPath(); ctx.moveTo(-80, -20); ctx.lineTo(80, -20); ctx.lineTo(60, 10); ctx.lineTo(-60, 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#8b2fc9';
  ctx.beginPath(); ctx.moveTo(0, 55); ctx.lineTo(34, 20); ctx.lineTo(30, -40); ctx.lineTo(-30, -40); ctx.lineTo(-34, 20); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d65bff';
  for (const gx of [-60, -30, 30, 60]) { ctx.fillRect(gx - 4, 4, 8, 18); }
  const glow = 0.6 + Math.sin(b.t * 6) * 0.4;
  ctx.fillStyle = `rgba(255,80,120,${glow})`;
  ctx.beginPath(); ctx.arc(0, 4, 12, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // 체력바
  ctx.fillStyle = '#0008'; ctx.fillRect(40, 44, W - 80, 10);
  ctx.fillStyle = '#ff4d6d'; ctx.fillRect(40, 44, (W - 80) * b.hp / b.max, 10);
  ctx.strokeStyle = '#fff6'; ctx.strokeRect(40, 44, W - 80, 10);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('보스 Lv.' + bossLevel, W / 2, 40);
}

function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Malgun Gothic","Apple SD Gothic Neo",sans-serif`;
  ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 12, (Math.random() - 0.5) * 12);
  ctx.fillStyle = '#070a1f'; ctx.fillRect(-10, -10, W + 20, H + 20);
  for (const s of stars) { ctx.fillStyle = `rgba(200,210,255,${s.z / 3.5})`; ctx.fillRect(s.x, s.y, s.z * 0.8, s.z * 1.6); }

  if (state !== 'title' && player) {
    for (const it of items) {
      const pulse = 1 + Math.sin(it.t * 8) * 0.1;
      ctx.fillStyle = it.kind === 'P' ? '#ffd84d' : '#6dff9e';
      ctx.beginPath(); ctx.arc(it.x, it.y, 13 * pulse, 0, Math.PI * 2); ctx.fill();
      text(it.kind === 'P' ? 'P' : '♥', it.x, it.y + 5, 14, '#222');
    }
    ctx.fillStyle = '#fff6a8';
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
    for (const e of enemies) drawEnemy(e);
    if (boss) drawBoss();
    for (const b of eBullets) {
      ctx.fillStyle = '#ff4d8d'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd1e3'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }
    if (state === 'play') drawPlayer();
  }
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life / p.max); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  if (state !== 'title' && player) {
    text('점수 ' + score.toLocaleString(), W - 12, 26, 18, '#fff', 'right');
    text('♥'.repeat(Math.max(0, player.hp)), W - 12, H - 16, 20, '#ff5d7a', 'right');
    text('파워 ' + '▮'.repeat(player.power), 12, H - 16, 16, '#ffd84d', 'left');
  }

  if (state === 'title') {
    text('하늘 슈터', W / 2, H / 2 - 90, 52, '#7fd4ff');
    text('✈', W / 2, H / 2 - 20, 48, '#fff');
    text('방향키 / WASD 또는 드래그로 이동', W / 2, H / 2 + 40, 17, '#c9d2ff');
    text('총알은 자동으로 발사됩니다', W / 2, H / 2 + 66, 17, '#c9d2ff');
    text('P = 파워업   ♥ = 체력 회복', W / 2, H / 2 + 92, 17, '#c9d2ff');
    if (Math.floor(performance.now() / 500) % 2) text('스페이스 또는 클릭하여 시작', W / 2, H / 2 + 150, 20, '#ffcc4d');
    text('최고 점수 ' + best.toLocaleString(), W / 2, H - 40, 16, '#9aa3d6');
  }
  if (state === 'over') {
    ctx.fillStyle = '#000a'; ctx.fillRect(0, H / 2 - 120, W, 230);
    text('게임 오버', W / 2, H / 2 - 60, 46, '#ff6b6b');
    text('점수 ' + score.toLocaleString(), W / 2, H / 2 - 10, 26);
    text((score >= best && score > 0 ? '🏆 새 최고 기록! ' : '최고 ') + best.toLocaleString(), W / 2, H / 2 + 26, 18, '#ffcc4d');
    text('스페이스 또는 클릭하여 다시 시작', W / 2, H / 2 + 80, 18, '#c9d2ff');
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
